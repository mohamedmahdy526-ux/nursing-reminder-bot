name: 🏥 Nursing Reminder Bot

on:
  # جدولة كل ساعة - الـ bot بيتحقق من وقت القاهرة قبل الإرسال
  schedule:
    - cron: '0 * * * *'

  # تشغيل يدوي (للتجربة)
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر المطلوب'
        required: true
        default: 'now'
        type: choice
        options:
          - now
          - status
          - topics
          - help

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    # بنمنع التشغيل المتوازي (concurrency)
    concurrency:
      group: nursing-reminder
      cancel-in-progress: false

    permissions:
      # لازم صلاحية الكتابة على الـ repo (للـ sent_topics.json)
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏥 Run Nursing Reminder Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'minimax/minimax-m3:free' }}
          # GitHub API: نستخدم الـ built-in token (مش محتاج Secret إضافي)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          COMMAND: ${{ github.event.inputs.command || 'auto' }}
        run: |
          CAIRO_HOUR=$(TZ='Africa/Cairo' date +%H)
          COMMAND_VALUE="${{ github.event.inputs.command || 'auto' }}"
          echo "🕐 Cairo hour: $CAIRO_HOUR:00 | Command: $COMMAND_VALUE"

          # Manual commands (now/status/topics/help) → اشتغل على طول
          if [ "$COMMAND_VALUE" != "auto" ]; then
            echo "✅ Manual command: $COMMAND_VALUE"
            python bot.py
            exit $?
          fi

          # Auto (scheduled) → اتحقق من الساعات النشطة
          if [ "$CAIRO_HOUR" -ge 8 ] && [ "$CAIRO_HOUR" -le 22 ]; then
            echo "✅ Active hour. Running bot..."
            python bot.py
          else
            echo "⏭️ Skipping: outside active hours (08:00-22:00 Cairo)"
            exit 0
          fi
