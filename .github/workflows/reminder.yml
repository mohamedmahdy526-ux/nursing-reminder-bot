name: 🏥 Nursing Reminder Bot

on:
  # جدولة يومية: 08:00 إلى 22:00 بتوقيت القاهرة (UTC+2/+3)
  # Cairo = UTC+2 (شتوي) أو UTC+3 (صيفي)
  # 08:00 Cairo = 06:00 UTC (شتوي) أو 05:00 UTC (صيفي)
  # هنستخدم UTC مباشرة: 06:00 → 20:00 (15 مرة، كل ساعة)
  schedule:
    # 06:00 UTC = 08:00 Cairo (شتوي)
    # 05:00 UTC = 08:00 Cairo (صيفي)
    # عشان نضمن التغطية على مدار السنة، هنشغّل كل ساعة من 05:00 لـ 20:00 UTC
    # والبوت نفسه هيتحقق من الوقت بتاع القاهرة قبل ما يبعت
    - cron: '0 5-20 * * *'

  # تشغيل يدوي (للتجربة أو إرسال Reminder فوري)
  workflow_dispatch:
    inputs:
      command:
        description: 'الأمر المطلوب'
        required: true
        default: 'now'
        type: choice
        options:
          - now
          - status
          - topics
          - help

jobs:
  send-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🏥 Run Nursing Reminder Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'minimax/minimax-m3:free' }}
          COMMAND: ${{ github.event.inputs.command || 'auto' }}
        run: |
          # التحقق من الوقت الحالي في القاهرة قبل الإرسال (لتجنب الإرسال في الساعات غير النشطة)
          CAIRO_HOUR=$(TZ='Africa/Cairo' date +%H)
          echo "🕐 Cairo hour: $CAIRO_HOUR:00"

          # الساعات النشطة: 08-22
          if [ "$CAIRO_HOUR" -ge 8 ] && [ "$CAIRO_HOUR" -le 22 ]; then
            echo "✅ Active hour. Running bot..."
            python bot.py
          else
            echo "⏭️ Skipping: outside active hours (08:00-22:00 Cairo)"
            exit 0
          fi
